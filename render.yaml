# Render Blueprint — deploys this repo as a free web service using the Dockerfile.
# Dashboard: New -> Blueprint -> connect this repo (or create a Web Service and let
# Render auto-detect the Dockerfile). It then prompts for the three secret env vars.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: CACHE_TTL_SECONDS
        value: "43200"
      - key: DAILY_CAP
        value: "200"
      - key: REQUEST_GAP_MS
        value: "2500"
      # Secrets — entered in the Render dashboard, never committed.
      - key: API_KEY
        sync: false
      - key: LI_AT
        sync: false
      - key: JSESSIONID
        sync: false
